name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canonicalizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Canonicalizer self-test
        run: python3 scripts/canonicalize_antivenoms.py --self-test

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Pytest suite
        run: python3 -m pytest scripts/tests/ -v --ignore=scripts/tests/test_security_config.py

  dataset-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate community notes
        run: python3 scripts/validate_community_notes.py

      - name: Validate location overrides
        run: python3 scripts/validate_location_overrides.py

      - name: Validate app/hospitals.json schema
        run: python3 scripts/validate_hospitals_json.py app/hospitals.json

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npm run format:check

  security-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pytest
        run: pip install pytest

      - name: Security configuration tests
        run: python3 -m pytest scripts/tests/test_security_config.py -v
